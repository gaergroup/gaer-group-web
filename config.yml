backend:
  name: github
  repo: TU_USUARIO/TU_REPOSITORIO
  branch: main
  base_url: https://TU-OAUTH-WORKER.workers.dev
  auth_endpoint: /auth

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

media_processing:
  enabled: true
  format:
    enabled: true
    default: webp
  quality: 82
  strip_metadata: true
  width: 1800
  height: null

collections:
  - name: "contenido"
    label: "Contenido de la web"
    files:
      - label: "Página principal"
        name: "site"
        file: "content/site.json"
        format: json
        fields:
          - label: "Marca"
            name: "brand"
            widget: "object"
            fields:
              - {label: "Nombre comercial", name: "name", widget: "string"}
              - label: "Eslogan"
                name: "tagline"
                widget: "object"
                fields:
                  - {label: "Español", name: "es", widget: "string"}
                  - {label: "English", name: "en", widget: "string"}

          - label: "Inicio"
            name: "hero"
            widget: "object"
            fields:
              - label: "Antetítulo"
                name: "eyebrow"
                widget: "object"
                fields:
                  - {label: "Español", name: "es", widget: "string"}
                  - {label: "English", name: "en", widget: "string"}
              - label: "Título"
                name: "title"
                widget: "object"
                fields:
                  - {label: "Español", name: "es", widget: "string"}
                  - {label: "English", name: "en", widget: "string"}
              - label: "Texto"
                name: "text"
                widget: "object"
                fields:
                  - {label: "Español", name: "es", widget: "text"}
                  - {label: "English", name: "en", widget: "text"}
              - {label: "Imagen principal", name: "image", widget: "image"}

          - label: "Servicios"
            name: "services"
            widget: "list"
            fields:
              - label: "Nombre"
                name: "title"
                widget: "object"
                fields:
                  - {label: "Español", name: "es", widget: "string"}
                  - {label: "English", name: "en", widget: "string"}
              - label: "Descripción"
                name: "text"
                widget: "object"
                fields:
                  - {label: "Español", name: "es", widget: "text"}
                  - {label: "English", name: "en", widget: "text"}

          - label: "Showroom"
            name: "showroom"
            widget: "object"
            fields:
              - label: "Antetítulo"
                name: "eyebrow"
                widget: "object"
                fields:
                  - {label: "Español", name: "es", widget: "string"}
                  - {label: "English", name: "en", widget: "string"}
              - label: "Título"
                name: "title"
                widget: "object"
                fields:
                  - {label: "Español", name: "es", widget: "string"}
                  - {label: "English", name: "en", widget: "string"}
              - label: "Texto"
                name: "text"
                widget: "object"
                fields:
                  - {label: "Español", name: "es", widget: "text"}
                  - {label: "English", name: "en", widget: "text"}
              - {label: "Foto", name: "image", widget: "image"}
              - label: "Puntos destacados"
                name: "points"
                widget: "list"
                fields:
                  - {label: "Español", name: "es", widget: "string"}
                  - {label: "English", name: "en", widget: "string"}

          - label: "Proyectos / galería"
            name: "projects"
            widget: "list"
            fields:
              - label: "Título"
                name: "title"
                widget: "object"
                fields:
                  - {label: "Español", name: "es", widget: "string"}
                  - {label: "English", name: "en", widget: "string"}
              - label: "Descripción"
                name: "text"
                widget: "object"
                fields:
                  - {label: "Español", name: "es", widget: "text"}
                  - {label: "English", name: "en", widget: "text"}
              - {label: "Foto", name: "image", widget: "image"}

          - label: "Contacto"
            name: "contact"
            widget: "object"
            fields:
              - label: "Antetítulo"
                name: "eyebrow"
                widget: "object"
                fields:
                  - {label: "Español", name: "es", widget: "string"}
                  - {label: "English", name: "en", widget: "string"}
              - label: "Título"
                name: "title"
                widget: "object"
                fields:
                  - {label: "Español", name: "es", widget: "string"}
                  - {label: "English", name: "en", widget: "string"}
              - label: "Texto"
                name: "text"
                widget: "object"
                fields:
                  - {label: "Español", name: "es", widget: "text"}
                  - {label: "English", name: "en", widget: "text"}
              - {label: "Teléfono 1", name: "phone1", widget: "string"}
              - {label: "Teléfono 2", name: "phone2", widget: "string"}
              - {label: "WhatsApp (solo números)", name: "whatsapp", widget: "string"}
              - {label: "Email", name: "email", widget: "string", required: false}
              - {label: "Dirección", name: "address", widget: "text", required: false}
              - {label: "Horario", name: "hours", widget: "text", required: false}
